kind = "web"
previewPath = "/"
title = "Aya Kharfan Portfolio"
description = "A professional single-page portfolio for Aya Kharfan, a multilingual translator and localization specialist. Features sections for About, Services, Impact stats, Partnerships, Translation Workspace tools, Credentials, and Contact. Uses a cream/navy/rust color palette with elegant serif typography."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
